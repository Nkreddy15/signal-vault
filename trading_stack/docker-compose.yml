services:
  crypto:
    build:
      context: ./crypto
    container_name: open-source-crypto-paper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
      FREQTRADE__API_SERVER__JWT_SECRET_KEY: ${FREQTRADE__API_SERVER__JWT_SECRET_KEY}
      FREQTRADE__API_SERVER__WS_TOKEN: ${FREQTRADE__API_SERVER__WS_TOKEN}
      PERSIST_DIR: /freqtrade/data
      SIGNAL_VAULT_CRYPTO_STRATEGY: ${SIGNAL_VAULT_CRYPTO_STRATEGY:-SignalVaultPaperExecutionV1}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - crypto_data:/freqtrade/data

  crypto_final:
    build:
      context: ./crypto
    container_name: signal-vault-paper-final
    restart: unless-stopped
    profiles: [final]
    entrypoint: ["python", "/freqtrade/user_data/paper_final.py"]
    environment:
      PAPER_FINAL_STATE_DIR: /freqtrade/data/paper-final-v9
    volumes:
      - crypto_data:/freqtrade/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/freqtrade/data/paper-final-v9/summary.json')); assert s['status'] in ('RUNNING','SESSION_COMPLETE','SESSION_LOSS_LIMIT') and time.time()*1000-s['last_success_ms']<120000"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  crypto_v10:
    build:
      context: ./crypto
    container_name: signal-vault-paper-v10
    restart: unless-stopped
    profiles: [v10]
    entrypoint: ["python", "/freqtrade/user_data/paper_v10.py"]
    environment:
      PAPER_V10_STATE_DIR: /freqtrade/data/paper-v10
    volumes:
      - crypto_data:/freqtrade/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/freqtrade/data/paper-v10/summary.json')); assert s['status'] in ('RUNNING','DRAINING','DAILY_LOSS_LIMIT','SESSION_COMPLETE','SESSION_LOSS_LIMIT') and time.time()*1000-(s['last_success_ms'] or 0)<120000"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  crypto_edge_lab:
    build:
      context: ./crypto
      dockerfile: Dockerfile.edge
    profiles: [edge]
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    volumes:
      - crypto_data:/freqtrade/data

  crypto_v8_forward_lab:
    build:
      context: ./crypto
    container_name: signal-vault-v8-forward-lab
    restart: unless-stopped
    profiles:
      - forwardlab
    entrypoint: ["python", "/freqtrade/user_data/v8_forward_lab.py"]
    environment:
      FORWARD_LAB_STATE_DIR: /freqtrade/data/v8-forward-lab
      FORWARD_LAB_POLL_SECONDS: "60"
      FORWARD_LAB_ENTRY_GRACE_MINUTES: "10"
    volumes:
      - crypto_data:/freqtrade/data

  crypto_v8_overnight:
    build:
      context: ./crypto
    container_name: signal-vault-v8-overnight-paper
    restart: "no"
    profiles:
      - overnight
    entrypoint: ["python", "/freqtrade/user_data/v8_overnight_paper.py"]
    environment:
      V8_STATE_DIR: /freqtrade/data/v8-overnight
      V8_STARTING_BALANCE: "100"
      V8_STAKE_USD: "15"
      V8_MAX_OPEN_TRADES: "3"
      V8_ROUND_TRIP_FRICTION: "0.0074"
      V8_TARGET_GROSS: "0.12"
      V8_STOP_GROSS: "0.04"
      V8_COOLDOWN_HOURS: "24"
      V8_MAX_HOLD_HOURS: "240"
      V8_POLL_SECONDS: "60"
      V8_OVERNIGHT_HOURS: "8"
      V8_ENTRY_GRACE_MINUTES: "10"
    volumes:
      - crypto_data:/freqtrade/data

  stocks:
    build:
      context: ./stocks
    container_name: open-source-stocks-paper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      ALPACA_IS_PAPER: "true"
      STOCK_LOGICAL_BUDGET_USD: "100"
      STOCK_DAILY_BUY_CAP: "16"

  dashboard:
    build:
      context: ./dashboard
    container_name: signal-vault-paper-dashboard
    restart: unless-stopped
    depends_on:
      - crypto
      - stocks
    env_file:
      - .env
    environment:
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      FREQTRADE_API_BASE: http://crypto:8080/api/v1
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD}
      STOCK_DAILY_BUY_CAP: "16"
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - crypto_data:/paper-data:ro

volumes:
  crypto_data:
