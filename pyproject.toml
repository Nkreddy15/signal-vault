[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-vault"
version = "0.1.0.dev0"
description = "Paper-only multi-market autonomous trading architecture and offline safety kernel"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Signal Vault Contributors"}]
dependencies = []

[project.optional-dependencies]
research = ["numpy>=2,<3", "scikit-learn>=1.7,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
