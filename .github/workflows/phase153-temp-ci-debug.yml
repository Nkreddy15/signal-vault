name: Phase 153 temporary CI diagnostic

on:
  push:
    branches:
      - phase153-fix-btc-shadow-namespace

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture focused test with system Python only
        run: |
          set +e
          PYTHONPATH=src python -m unittest tests.test_phase153_shadow_namespace -v > phase153-ci-debug.txt 2>&1
          code=$?
          echo "$code" > phase153-ci-exit-code.txt
          cat phase153-ci-debug.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: phase153-ci-debug-${{ github.run_id }}
          path: |
            phase153-ci-debug.txt
            phase153-ci-exit-code.txt
          if-no-files-found: error
          retention-days: 1
