# Manual keyless replay of exact 90-day crypto history for cross-sectional research.
name: Replay 90-day cross-sectional crypto research (no DATA keys)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful 90-day historical research workflow run"
        type: string
        required: true
        default: "36927348918"

permissions:
  contents: read
  actions: read

concurrency:
  group: crypto-90day-cross-sectional-replay
  cancel-in-progress: false

jobs:
  replay-cross-sectional:
    if: github.repository == 'Nkreddy15/signal-vault' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout reviewed default-branch research code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-only project
        run: python -m pip install --no-cache-dir .

      - name: Download exact previous 90-day private artifact
        uses: actions/download-artifact@v4
        with:
          name: crypto-90day-candidate-research-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: downloaded-history

      - name: Run cross-sectional 90-day research review
        run: |
          set +e
          python -m signal_vault.cross_sectional_crypto_review downloaded-history \
            --output cross_sectional_90day_review.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            exit 2
          fi
          if [ "$code" -eq 3 ]; then
            echo "Cross-sectional candidate did not qualify."
          fi

      - name: Archive cross-sectional receipt
        uses: actions/upload-artifact@v4
        with:
          name: crypto-90day-cross-sectional-replay-${{ github.run_id }}
          path: cross_sectional_90day_review.json
          if-no-files-found: error
          retention-days: 7
