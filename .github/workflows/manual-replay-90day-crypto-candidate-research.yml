# Manual keyless replay of the exact 90-day crypto research artifact.
# No Alpaca DATA credentials and no order submission.
name: Replay 90-day crypto candidate research (no DATA keys)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful 90-day historical research workflow run"
        type: string
        required: true
        default: "36927348918"

permissions:
  contents: read
  actions: read

concurrency:
  group: crypto-90day-candidate-replay
  cancel-in-progress: false

jobs:
  replay-90day-private-history:
    if: github.repository == 'Nkreddy15/signal-vault' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout reviewed default-branch analysis code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-only project
        run: python -m pip install --no-cache-dir .

      - name: Download exact previous 90-day private artifact
        uses: actions/download-artifact@v4
        with:
          name: crypto-90day-candidate-research-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: downloaded-history

      - name: SHA-audit source and replay current offline candidate set
        env:
          SIGNAL_VAULT_REPLAY_MODE: EXISTING_PRIVATE_HISTORY_ONLY
          SIGNAL_VAULT_REPLAY_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SIGNAL_VAULT_REPLAY_HYPOTHESIS_SET: LONG_HORIZON_90D
        run: python -m signal_vault.ci_replay_history

      - name: Build expanded seven-candidate long-horizon receipt
        run: |
          set +e
          python -m signal_vault.long_horizon_crypto_candidate_review \
            private-v2-replay/offline_research_analysis.json \
            --output private-v2-replay/long_horizon_candidate_review.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            exit 2
          fi
          if [ "$code" -eq 3 ]; then
            echo "Replay completed but no long-horizon candidate qualified."
          fi

      - name: Archive replay report and candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: crypto-90day-seven-candidate-replay-${{ github.run_id }}
          path: |
            private-v2-replay/offline_research_analysis.json
            private-v2-replay/replay_manifest.json
            private-v2-replay/long_horizon_candidate_review.json
          if-no-files-found: error
          retention-days: 7
