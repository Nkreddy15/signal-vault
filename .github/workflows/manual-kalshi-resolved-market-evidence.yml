# MANUAL ONLY: one exact historical Kalshi market evidence capture.
# Public GET-only; no credentials, signing, portfolio access or orders.
name: Manual Kalshi resolved-market evidence

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Exact historical Kalshi market ticker"
        type: string
        required: true
      start_ts:
        description: "Unix start timestamp (inclusive)"
        type: string
        required: true
      end_ts:
        description: "Unix end timestamp (exclusive), max 120 days"
        type: string
        required: true
      max_trade_pages:
        description: "Maximum 1000-row trade pages (1-50)"
        type: string
        required: true
        default: "10"

permissions:
  contents: read

concurrency:
  group: kalshi-resolved-market-public-manual
  cancel-in-progress: false

jobs:
  resolved-market-get-only:
    if: github.repository == 'Nkreddy15/signal-vault' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install --no-cache-dir -e .

      - name: Capture exact historical market evidence
        env:
          TICKER: ${{ inputs.ticker }}
          START_TS: ${{ inputs.start_ts }}
          END_TS: ${{ inputs.end_ts }}
          MAX_TRADE_PAGES: ${{ inputs.max_trade_pages }}
        run: |
          set -euo pipefail
          safe_ticker="$(printf '%s' "$TICKER" | tr -cd 'A-Z0-9_-')"
          test "$safe_ticker" = "$TICKER"
          python -m signal_vault.kalshi_resolved_market_evidence             --ticker "$TICKER"             --start-ts "$START_TS"             --end-ts "$END_TS"             --max-trade-pages "$MAX_TRADE_PAGES"             --output "private-kalshi-resolved-$safe_ticker"

      - name: Archive exact market evidence
        uses: actions/upload-artifact@v4
        with:
          name: kalshi-resolved-market-${{ github.run_id }}
          path: private-kalshi-resolved-*/**
          if-no-files-found: error
          retention-days: 7
