name: Signal Vault paper-only safety checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project with research dependencies
        run: python -m pip install -e '.[research,equity-research]'
      - name: Compile sources
        run: python -m compileall -q src tests
      - name: Diagnose Phase 50 test only
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_phase50*.py' -v
