name: Signal Vault paper-only safety checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Diagnostic install
        shell: bash
        run: |
          set +e
          python -m pip install -e '.[research,equity-research]' > /tmp/install.txt 2>&1
          echo $? > /tmp/install.code
          set -e
          cat /tmp/install.txt
      - name: Diagnostic compile
        shell: bash
        run: |
          set +e
          python -m compileall -q src tests > /tmp/compile.txt 2>&1
          echo $? > /tmp/compile.code
          set -e
          cat /tmp/compile.txt
      - name: Diagnostic tests
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/tests.txt 2>&1
          echo $? > /tmp/tests.code
          set -e
          tail -n 250 /tmp/tests.txt || true
      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-ci-${{ matrix.python-version }}
          path: |
            /tmp/install.txt
            /tmp/install.code
            /tmp/compile.txt
            /tmp/compile.code
            /tmp/tests.txt
            /tmp/tests.code
          if-no-files-found: warn
          retention-days: 1
      - name: Fail if any diagnostic stage failed
        if: always()
        shell: bash
        run: |
          code=0
          for f in /tmp/install.code /tmp/compile.code /tmp/tests.code; do
            if [ ! -f "$f" ] || [ "$(cat "$f")" != "0" ]; then code=1; fi
          done
          exit "$code"
      - name: Verify live mode is explicitly refused
        env:
          PYTHONPATH: src
          SIGNAL_VAULT_MODE: live
        run: |
          set +e
          python -m signal_vault > /tmp/sv-live-refusal.txt 2>&1
          result=$?
          set -e
          if [ "$result" -eq 0 ] || ! grep -Fq 'PAPER ONLY' /tmp/sv-live-refusal.txt; then
            echo 'SECURITY REGRESSION: an explicit PAPER ONLY refusal is required' >&2
            exit 1
          fi
          echo 'PASS: explicitly rejected live mode'
      - name: Disallow live Alpaca trading host in source
        run: |
          if grep -R -F 'https://api.alpaca.markets' src/; then
            echo 'SECURITY REGRESSION: unreviewed live Alpaca URL in source' >&2
            exit 1
          fi
