name: Reconcile experimental BTC PAPER sandbox

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub run ID of the executed experimental BTC PAPER sandbox"
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: experimental-supervised-btc-paper-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'Nkreddy15/signal-vault' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir .
      - name: Download executed sandbox evidence
        uses: actions/download-artifact@v4
        with:
          name: experimental-btc-paper-${{ inputs.source_run_id }}
          run-id: ${{ inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: sandbox-evidence
      - name: Re-lock downloaded evidence
        run: |
          chmod 700 sandbox-evidence
          find sandbox-evidence -type f -exec chmod 600 {} +
      - name: Reconcile by read-only Alpaca PAPER GET
        env:
          ALPACA_PAPER_KEY_ID: ${{ secrets.ALPACA_PAPER_KEY_ID }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.ALPACA_PAPER_SECRET_KEY }}
        run: |
          python -m signal_vault.experimental_paper_reconcile \
            --source-receipt sandbox-evidence/paper-sandbox-receipt.json \
            --journal sandbox-evidence/paper-sandbox-journal.sqlite3 \
            --output experimental-paper-reconciliation.json
      - name: Archive reconciled journal and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-btc-paper-reconciliation-${{ github.run_id }}
          path: |
            experimental-paper-reconciliation.json
            sandbox-evidence/paper-sandbox-journal.sqlite3
          if-no-files-found: warn
          retention-days: 7
