name: Phase 162 ML candidate tournament

on:
  workflow_dispatch:
  push:
    branches:
      - phase-162-multimarket-reset
    paths:
      - "src/signal_vault/ml_candidate_tournament.py"
      - "tests/test_phase162_ml_candidate_tournament.py"
      - ".github/workflows/phase162-ml-candidate-tournament.yml"
      - "pyproject.toml"

permissions:
  contents: read
  actions: read

jobs:
  crypto-ml-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reset branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Signal Vault research dependencies
        run: python -m pip install --no-cache-dir ".[research]"

      - name: Run Phase 162 chronology tests
        run: python -m unittest tests.test_phase162_ml_candidate_tournament -v

      - name: Download preserved 90-day six-crypto history
        uses: actions/download-artifact@v4
        with:
          name: crypto-90day-candidate-research-36927348918
          run-id: 36927348918
          repository: Nkreddy15/signal-vault
          github-token: ${{ github.token }}
          path: downloaded-history

      - name: Lock downloaded research inputs read-only
        run: |
          chmod 700 downloaded-history
          find downloaded-history -type d -exec chmod 700 {} +
          find downloaded-history -type f -exec chmod 600 {} +

      - name: Run chronological ML candidate tournament
        run: |
          python -m signal_vault.ml_candidate_tournament downloaded-history \
            --output phase162_ml_candidate_tournament.json

      - name: Upload ML tournament result
        uses: actions/upload-artifact@v4
        with:
          name: phase162-ml-candidate-tournament-${{ github.run_id }}
          path: phase162_ml_candidate_tournament.json
          if-no-files-found: error
          retention-days: 14
