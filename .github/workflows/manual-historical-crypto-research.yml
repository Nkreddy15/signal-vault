# MANUAL ONLY: historical authenticated Alpaca DATA GET. No schedules, pull
# request execution, broker account permissions, trading API, live host, paid
# Railway changes, or automatic crypto trades. Secrets are in only ONE step.
name: Manual multi-crypto historical DATA GET (research only)

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: "Inclusive UTC start; default aligned Sept 14 twelve-market history"
        type: string
        required: true
        default: "2026-09-14T00:00:00Z"
      end_utc:
        description: "Exclusive UTC end; default Sep 26 closed history"
        type: string
        required: true
        default: "2026-09-26T00:00:00Z"
      symbols:
        description: "Default SIX crypto to auto-join previously verified stock history"
        type: choice
        options:
          - "BTC/USD ETH/USD"
          - "BTC/USD ETH/USD SOL/USD"
          - "BTC/USD ETH/USD SOL/USD LTC/USD LINK/USD AVAX/USD"
        default: "BTC/USD ETH/USD SOL/USD LTC/USD LINK/USD AVAX/USD"
        required: true

permissions:
  contents: read

concurrency:
  group: historical-crypto-manual-read-only
  cancel-in-progress: false

jobs:
  historical-get-only:
    if: github.repository == 'Nkreddy15/signal-vault' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout reviewed default-branch research only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install source-only project
        run: python -m pip install --no-cache-dir .

      - name: Strict offline dry-run (before accessing secrets)
        env:
          SV_START_UTC: ${{ inputs.start_utc }}
          SV_END_UTC: ${{ inputs.end_utc }}
          SV_SYMBOLS: ${{ inputs.symbols }}
        run: |
          python - <<'PY'
          import json,os
          from signal_vault.multi_asset_research_cli import historical_plan,aware
          from signal_vault.research_universe import AssetClass
          plan=historical_plan(
              symbols=os.environ["SV_SYMBOLS"].split(),
              start=aware(os.environ["SV_START_UTC"]),
              end=aware(os.environ["SV_END_UTC"]),
              market=AssetClass.CRYPTO)
          print(json.dumps(plan,sort_keys=True))
          PY

      - name: Authenticated HISTORICAL DATA GET only (never log secrets)
        env:
          SIGNAL_VAULT_RESEARCH_READ_APPROVED: HISTORICAL_CRYPTO_DATA_GET_ONLY
          SIGNAL_VAULT_RESEARCH_START_UTC: ${{ inputs.start_utc }}
          SIGNAL_VAULT_RESEARCH_END_UTC: ${{ inputs.end_utc }}
          SIGNAL_VAULT_RESEARCH_SYMBOLS: ${{ inputs.symbols }}
          SIGNAL_VAULT_RESEARCH_DATA_KEY_ID: ${{ secrets.SIGNAL_VAULT_RESEARCH_DATA_KEY_ID }}
          SIGNAL_VAULT_RESEARCH_DATA_SECRET: ${{ secrets.SIGNAL_VAULT_RESEARCH_DATA_SECRET }}
        run: python -m signal_vault.ci_historical_crypto

      - name: Offline SHA audit and THREE cost-stress research reports (no secrets)
        env:
          SIGNAL_VAULT_RESEARCH_READ_APPROVED: HISTORICAL_CRYPTO_DATA_GET_ONLY
          SIGNAL_VAULT_RESEARCH_START_UTC: ${{ inputs.start_utc }}
          SIGNAL_VAULT_RESEARCH_END_UTC: ${{ inputs.end_utc }}
          SIGNAL_VAULT_RESEARCH_SYMBOLS: ${{ inputs.symbols }}
        run: python -m signal_vault.ci_historical_report

      - name: Build supervised-PAPER historical bootstrap receipt when eligible
        run: |
          set +e
          python -m signal_vault.historical_bootstrap_validation \
            private-historical-artifacts/offline_research_analysis.json \
            --output private-historical-artifacts/historical_bootstrap_validation.json
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "Historical bootstrap validation failed closed."
            exit 2
          fi
          if [ "$code" -eq 3 ]; then
            echo "Historical research completed but did not qualify for supervised PAPER bootstrap."
          fi

      - name: Explain whether this request activates the paired twelve-market job
        env:
          REQUEST_START: ${{ inputs.start_utc }}
          REQUEST_END: ${{ inputs.end_utc }}
          REQUEST_SYMBOLS: ${{ inputs.symbols }}
        run: |
          python - <<'PY'
          import os
          eligible=(
              os.environ["REQUEST_START"]=="2026-09-14T00:00:00Z" and
              os.environ["REQUEST_END"]=="2026-09-26T00:00:00Z" and
              os.environ["REQUEST_SYMBOLS"]==
              "BTC/USD ETH/USD SOL/USD LTC/USD LINK/USD AVAX/USD"
          )
          label=("PAIRED_12_MARKET_JOB_ELIGIBLE_AFTER_ARCHIVE_UPLOAD" if eligible
                 else "HISTORICAL_ONLY_PAIRED_12_MARKET_JOB_WILL_SKIP")
          print(label)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("### Manual historical run\\n\\n"+
                        ("Twelve-market stock pairing: **ELIGIBLE**.\\n" if eligible
                         else "Twelve-market stock pairing: **SKIPPED by chosen input dates/symbols**.\\n"))
          PY

      - name: Archive SHA-named history AND offline report (expires in 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: bounded-crypto-history-and-offline-research-${{ github.run_id }}
          path: private-historical-artifacts/*.json
          if-no-files-found: error
          retention-days: 7

  # One CLICK for the new Sept14-26 six-crypto source triggers a SECOND,
  # wholly keyless job: it joins that fully SHA-verified new historical
  # source to the previously reviewed private six-stock IEX run #36637836735.
  # NO provider secrets are exposed in this job; all data is retrospective.
  paired-stocks-twelve-asset-offline-research:
    needs: historical-get-only
    if: |
      github.repository == 'Nkreddy15/signal-vault' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.start_utc == '2026-09-14T00:00:00Z' &&
      inputs.end_utc == '2026-09-26T00:00:00Z' &&
      inputs.symbols == 'BTC/USD ETH/USD SOL/USD LTC/USD LINK/USD AVAX/USD'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout strictly offline analysis source only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install independent XNYS session validator, no Alpaca SDK
        run: python -m pip install --no-cache-dir '.[equity-research]'

      - name: Get EXACT new crypto history from successful first job
        uses: actions/download-artifact@v4
        with:
          name: bounded-crypto-history-and-offline-research-${{ github.run_id }}
          path: aligned-crypto-history

      - name: Get previously verified PRIVATE historical IEX source, no DATA keys
        uses: actions/download-artifact@v4
        with:
          name: historical-6-equities-IEX-core-hours-36637836735
          run-id: 36637836735
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: reviewed-stock-IEX-history

      - name: SHA/XNYS re-audit, synchronize horizons and compare ONE shared 100 dollars
        run: |
          python -m signal_vault.joint_historical_source \
            --crypto-artifact aligned-crypto-history \
            --stock-artifact reviewed-stock-IEX-history \
            --output offline_twelve_market_joint_research.json

      - name: Privately archive ONLY the combined offline 12-market research
        uses: actions/upload-artifact@v4
        with:
          name: offline-12-market-common-horizon-${{ github.run_id }}
          path: offline_twelve_market_joint_research.json
          if-no-files-found: error
          retention-days: 7
